openapi: 3.0.3
info:
  title: SecureScan API
  version: v1
  description: >-
    Authenticated API for submitting authorized network scans and reading
    owner-scoped status, results, and history. Only scan systems you own or
    have explicit permission to test.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: https://localhost:8243/securescan/v1
    description: Local WSO2 API Manager Gateway
tags:
  - name: Scans
  - name: Administration
  - name: Allowed Targets
security:
  - oauth2: [securescan:scan]
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Read the Ballerina service liveness state
      description: >-
        Private service health endpoint used by Compose. API Manager does not
        need to publish this operation to external consumers.
      security: []
      responses:
        '200':
          description: Ballerina listener is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                success: true
                data:
                  status: ok
                  serviceName: securescan-api
  /api/v1/scans:
    post:
      tags: [Scans]
      operationId: createScan
      summary: Submit an authorized scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanRequest'
            example:
              target: scanme.nmap.org
              startPort: 1
              endPort: 100
              authorized: true
      responses:
        '202':
          description: Durable scan job accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Scans]
      operationId: listScans
      summary: List owner-scoped scan history
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursorCreatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: cursorId
          in: query
          schema:
            type: string
            format: uuid
        - name: ownerSubject
          in: query
          description: Exact owner subject; selecting another owner requires securescan-admin.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '200':
          description: Owner-scoped history page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/scans/{scanId}:
    get:
      tags: [Scans]
      operationId: getScan
      summary: Read an owner-authorized scan
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Scan status and terminal results when complete
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/allowed-targets:
    get:
      tags: [Allowed Targets]
      operationId: listAllowedTargets
      summary: List globally allowed scan targets
      security:
        - oauth2: [securescan:admin]
      parameters:
        - name: includeDisabled
          in: query
          schema:
            type: boolean
            default: false
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Bounded allowed-target list
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedTargetListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Allowed Targets]
      operationId: createAllowedTarget
      summary: Add a globally allowed exact hostname, IP, or CIDR
      security:
        - oauth2: [securescan:admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllowedTargetRequest'
            example:
              targetKind: HOSTNAME
              target: scanme.nmap.org
              startPort: 1
              endPort: 100
      responses:
        '201':
          description: Allowed target created and audited
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedTargetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/scans:
    get:
      tags: [Administration]
      operationId: listAdminScans
      summary: List scans across all users, including blocked and failed scans
      security:
        - oauth2: [securescan:admin]
      parameters:
        - name: ownerSubject
          in: query
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, completed, failed, blocked]
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Bounded administrator scan list
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminScanListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/audit-logs:
    get:
      tags: [Administration]
      operationId: listAuditLogs
      summary: List immutable security and lifecycle audit events
      security:
        - oauth2: [securescan:admin]
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Latest audit events
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/usage:
    get:
      tags: [Administration]
      operationId: getAdminUsage
      summary: Read platform-wide scan, user, and policy counts
      security:
        - oauth2: [securescan:admin]
      responses:
        '200':
          description: Current platform usage counters
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUsageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/allowed-targets/{targetId}:
    delete:
      tags: [Allowed Targets]
      operationId: disableAllowedTarget
      summary: Soft-disable an allowed target
      description: The target and immutable audit history are retained.
      security:
        - oauth2: [securescan:admin]
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allowed target disabled and audited
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedTargetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: WSO2 Identity Server user access token validated by API Manager.
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          tokenUrl: https://localhost:9443/oauth2/token
          scopes:
            securescan:scan: Create scans and read owner-authorized scan data.
            securescan:admin: Read platform administration data and manage the global allowed-target policy.
          x-scopes-mappings:
            securescan:scan:
              display-name: SecureScan scan access
            securescan:admin:
              display-name: SecureScan platform administration
          x-scopes-bindings:
            securescan:scan: securescan-user,securescan-admin
            securescan:admin: securescan-admin
  headers:
    RequestId:
      description: Correlation identifier shared with the response envelope.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request validation failed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid API or trusted-gateway authentication
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated identity lacks the required role or owner access
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Scan does not exist or is not visible to the caller
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Gateway quota or per-owner active scan limit reached
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds the caller should wait before retrying when supplied
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Safe internal processing failure
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Scanner or persistence dependency unavailable
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body exceeds the 4,096-byte API limit
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: An enabled allowed target already has the same value and port range
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: false
          required: [status, serviceName]
          properties:
            status:
              type: string
              enum: [ok]
            serviceName:
              type: string
              example: securescan-api
    CreateScanRequest:
      type: object
      additionalProperties: false
      required: [target, startPort, endPort, authorized]
      properties:
        target:
          type: string
          minLength: 1
          maxLength: 253
        startPort:
          type: integer
          minimum: 1
          maximum: 65535
        endPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Inclusive end port; the range may contain at most 1,000 ports.
        authorized:
          type: boolean
          description: Caller confirms ownership or explicit permission to scan.
    ScanSummary:
      type: object
      required: [id, status, target, startPort, endPort]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ScanStatus'
        target:
          type: string
        startPort:
          type: integer
        endPort:
          type: integer
    ScanHistoryItem:
      allOf:
        - $ref: '#/components/schemas/ScanSummary'
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ScanDetail:
      allOf:
        - $ref: '#/components/schemas/ScanHistoryItem'
        - type: object
          properties:
            failureCode:
              type: string
            result:
              $ref: '#/components/schemas/ScanResult'
    ScanResult:
      type: object
      additionalProperties: false
      required: [target, startPort, endPort, results, durationNanos]
      properties:
        target:
          type: string
        startPort:
          type: integer
        endPort:
          type: integer
        durationNanos:
          type: integer
          format: int64
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/PortResult'
    PortResult:
      type: object
      additionalProperties: false
      required: [address, port, state]
      properties:
        address:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        state:
          type: string
          enum: [open, closed]
    ScanStatus:
      type: string
      enum: [queued, accepted, running, completed, failed, blocked]
    CreateScanResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/ScanSummary'
    ScanStatusResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/ScanDetail'
    ScanHistoryResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: false
          required: [items, pageSize]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ScanHistoryItem'
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
    AdminScan:
      allOf:
        - $ref: '#/components/schemas/ScanHistoryItem'
        - type: object
          required: [ownerSubject]
          properties:
            ownerSubject: { type: string, minLength: 1, maxLength: 255 }
            failureCode: { type: string }
    AdminScanListResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          additionalProperties: false
          required: [items, pageSize]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminScan' }
            pageSize: { type: integer, minimum: 1, maximum: 100 }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actorType, action, outcome, metadata]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorType: { type: string, enum: [USER, ADMIN, SERVICE, SYSTEM] }
        actorSubject: { type: string, nullable: true }
        ownerSubject: { type: string, nullable: true }
        action: { type: string }
        outcome: { type: string, enum: [SUCCESS, DENIED, FAILURE] }
        requestId: { type: string, format: uuid, nullable: true }
        scanJobId: { type: string, format: uuid, nullable: true }
        allowedTargetId: { type: string, format: uuid, nullable: true }
        metadata: { type: object, additionalProperties: true }
    AuditEventListResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          additionalProperties: false
          required: [items, pageSize]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditEvent' }
            pageSize: { type: integer, minimum: 1, maximum: 100 }
    AdminUsageResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          additionalProperties: false
          required: [totalUsers, totalScans, queuedScans, runningScans, completedScans, failedScans, blockedScans, enabledAllowedTargets]
          properties:
            totalUsers: { type: integer, minimum: 0 }
            totalScans: { type: integer, minimum: 0 }
            queuedScans: { type: integer, minimum: 0 }
            runningScans: { type: integer, minimum: 0 }
            completedScans: { type: integer, minimum: 0 }
            failedScans: { type: integer, minimum: 0 }
            blockedScans: { type: integer, minimum: 0 }
            enabledAllowedTargets: { type: integer, minimum: 0 }
    CreateAllowedTargetRequest:
      type: object
      additionalProperties: false
      required: [targetKind, target]
      properties:
        targetKind:
          type: string
          enum: [HOSTNAME, IP, CIDR]
        target:
          type: string
          minLength: 1
          maxLength: 253
        startPort:
          type: integer
          minimum: 1
          maximum: 65535
        endPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: Required with startPort and must be greater than or equal to it.
    AllowedTarget:
      type: object
      additionalProperties: false
      required:
        [id, targetKind, target, enabled, createdBySubject, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        targetKind:
          type: string
          enum: [HOSTNAME, IP, CIDR]
        target:
          type: string
        startPort:
          type: integer
        endPort:
          type: integer
        enabled:
          type: boolean
        createdBySubject:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AllowedTargetResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/AllowedTarget'
    AllowedTargetListResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: false
          required: [items, pageSize]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AllowedTarget'
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ApiError'
      example:
        success: false
        error:
          code: INVALID_PORT_RANGE
          message: Port range must contain at most 1000 ports
          requestId: 710ee544-7f9c-4ef0-a4c0-1d430ae649bf
