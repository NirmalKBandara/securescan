type: api
version: v4.5.0
data:
  name: SecureScanAPI
  description: Authenticated scan workflows and admin-only allowed-target management.
  context: /securescan
  version: v1
  provider: admin
  lifeCycleStatus: PUBLISHED
  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://host.docker.internal:9090
      config:
        actionSelect: fault
        actionDuration: "10000"
        retryTimeOut: "0"
        retryDelay: "0"
  endpointImplementationType: ENDPOINT
  policies:
    - SecureScanUser
    - SecureScanAdmin
  enableSchemaValidation: true
  transport:
    - https
  type: HTTP
  visibility: PUBLIC
  corsConfiguration:
    corsConfigurationEnabled: true
    accessControlAllowOrigins:
      - http://localhost:3000
    accessControlAllowCredentials: false
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowMethods:
      - GET
      - POST
      - DELETE
      - OPTIONS
  mediationPolicies:
    - name: securescan-identity-in
      type: IN
      shared: false
