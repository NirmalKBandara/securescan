type: api
version: v4.5.0
data:
  name: SecureScanAPI
  description: Authenticated SecureScan scan submission, status, and history API.
  context: /securescan
  version: v1
  provider: admin
  lifeCycleStatus: PUBLISHED
  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://host.docker.internal:9090
  endpointImplementationType: ENDPOINT
  policies:
    - Unlimited
  transport:
    - https
  type: HTTP
  visibility: PUBLIC
  corsConfiguration:
    corsConfigurationEnabled: true
    accessControlAllowOrigins:
      - http://localhost:3000
    accessControlAllowCredentials: false
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowMethods:
      - GET
      - POST
      - OPTIONS
  mediationPolicies:
    - name: securescan-identity-in
      type: IN
      shared: false
