name: securescan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securescan_dev}
      POSTGRES_USER: ${POSTGRES_USER:-securescan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securescan_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-development-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  identity-server:
    image: wso2/wso2is:7.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WSO2_IS_HTTPS_PORT:-9443}:9443"
    volumes:
      - identity-server-development-data:/home/wso2carbon/wso2is-7.3.0/repository/database
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --insecure
        - https://localhost:9443/api/health-check/v1.0/health
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  api-manager:
    image: ${WSO2_APIM_IMAGE:-wso2/wso2am:4.7.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WSO2_APIM_HTTPS_PORT:-9444}:9443"
      - "127.0.0.1:${WSO2_APIM_GATEWAY_HTTPS_PORT:-8243}:8243"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-manager-development-data:/home/wso2carbon/wso2am-${WSO2_APIM_HOME_VERSION:-4.7.0}/repository/database
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --insecure
        - https://localhost:9443/publisher
      interval: 15s
      timeout: 15s
      retries: 40
      start_period: 180s

volumes:
  postgres-development-data:
    name: securescan-postgres-development-data
  identity-server-development-data:
    name: securescan-identity-server-development-data
  api-manager-development-data:
    name: securescan-api-manager-development-data
